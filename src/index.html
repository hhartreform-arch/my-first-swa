<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>担当者別ダッシュボード</title>
<link rel="stylesheet" href="style.css">
<style>
  .blockgrp { margin-bottom: 22px; }
  .blockgrp > h3 { font-size: 13px; margin: 0 0 8px; color: var(--navy);
    border-bottom: 2px solid var(--navy); padding-bottom: 4px; }
  .branch { margin: 0 0 10px 8px; }
  .branch h4 { font-size: 12px; margin: 0 0 5px; color: var(--text); font-weight: 700; }
  .owners { display: flex; flex-wrap: wrap; gap: 5px; }
  .owners a { text-decoration: none; color: var(--text); background: #fff;
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; font-size: 12px; }
  .owners a:hover { border-color: var(--navy); background: #f2f7fa; }
  .owners a b { color: var(--navy); }
  .lead { display: flex; gap: 10px; margin-bottom: 18px; }
  .lead a { flex: 1; text-decoration: none; background: var(--navy); color: #fff;
    border-radius: 5px; padding: 14px 16px; font-weight: 700; }
  .lead a span { display: block; font-size: 11px; font-weight: 400; opacity: .85; }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">
  <span class="title-chip">担当者別ダッシュボード</span>
  <div class="navlinks" style="margin-left:auto"><a href="#" id="diagLink">データ診断</a></div>
</div></div>

<div class="wrap">
  <div id="errorBox" class="err"></div>
  <div id="loading" class="loading">データを読み込んでいます…</div>
  <div id="diagBox" class="card" style="display:none;margin-bottom:16px"></div>

  <div class="lead">
    <a href="weekly.html">日次・週次確認<span>いま案件がどこにあるか／契約前の見込みランク</span></a>
    <a href="monthly.html">月次確認<span>粗利の4要素／価格帯別・媒体別／毀損</span></a>
  </div>

  <h2 class="sec">ブロック・支店・担当者から開く<span class="note" id="scopeNote"></span></h2>
  <div id="list"></div>
</div>

<script src="shared.js"></script>
<script>
(async function () {
  const P = getParams();
  try {
    setLoading(true);
    const deals = await loadDeals('発生案件');
    mountDiagnostics(P);
    document.getElementById('scopeNote').textContent =
      `${CONFIG.minYear}年以降のデータがある範囲のみ表示`;

    const byBlock = groupBy(deals, d => d.block, '（ブロック未入力）');
    const blocks = [...byBlock.keys()].sort((a, b) => a.localeCompare(b, 'ja'));

    document.getElementById('list').innerHTML = blocks.map(bl => {
      const inBlock = byBlock.get(bl);
      const byBranch = groupBy(inBlock, d => d.branch, '（支店未入力）');
      const branches = [...byBranch.keys()].sort((a, b) => a.localeCompare(b, 'ja'));
      const qb = 'block=' + encodeURIComponent(bl);

      return `<div class="blockgrp">
        <h3>${esc(bl)}（${inBlock.length.toLocaleString('ja-JP')}件）
          <a href="weekly.html?${qb}" style="font-size:11px;margin-left:8px">ブロック全体を見る</a></h3>
        ${branches.map(br => {
          const q = qb + '&branch=' + encodeURIComponent(br);
          const owners = uniqueSorted(byBranch.get(br).map(d => d.owner));
          return `<div class="branch">
            <h4>${esc(br)}（${byBranch.get(br).length.toLocaleString('ja-JP')}件）</h4>
            <div class="owners">
              <a href="weekly.html?${q}"><b>支店全体</b></a>
              ${owners.map(o => `<a href="weekly.html?${q}&owner=${encodeURIComponent(o)}">${esc(o)}</a>`).join('')}
            </div></div>`;
        }).join('')}
      </div>`;
    }).join('');
  } catch (e) {
    showError(e.message || String(e));
    mountDiagnostics({ debug: true });
  } finally {
    setLoading(false);
  }
})();
</script>
</body>
</html>
