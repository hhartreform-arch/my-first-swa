
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>担当者別ダッシュボード｜日次・週次</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="title-chip" id="chipTitle">支店／担当者</span>
    <div class="selects">
      <select id="branchSelect"></select>
      <select id="ownerSelect"></select>
      <select id="yearSelect"></select>
    </div>
    <div class="navlinks">
      <a href="weekly.html" class="active">日次・週次</a>
      <a href="monthly.html">月次</a>
    </div>
    <div class="badge-use">日次・週次確認<br>メンバー用</div>
  </div>
</div>

<div class="wrap">
  <div id="errorBox" class="err"></div>
  <div id="loading" class="loading">データを読み込んでいます…</div>
  <div id="main" style="display:none">

    <!-- 1. 今年の実績 -->
    <h2 class="sec">今年の実績
      <span class="note">濃い塗り＝実績／斜線＝見込み（S・Aのみ）／赤線＝目標</span>
    </h2>
    <div class="grid2">
      <div class="card">
        <h3 class="sub">契約売上</h3>
        <div class="perf" id="perfContract"></div>
      </div>
      <div class="card">
        <h3 class="sub">完工売上</h3>
        <div class="perf" id="perfComplete"></div>
      </div>
    </div>

    <!-- 2. 月次推移 -->
    <div class="tbl-scroll" style="margin-top:14px">
      <table class="mini" id="monthTable"></table>
    </div>
    <div class="note-box" id="targetNote"></div>

    <!-- 3. 今月の状況 -->
    <h2 class="sec">今月の状況</h2>
    <div class="kpi-row" id="kpiRow"></div>

    <!-- 4. いま案件がどこにあるか -->
    <h2 class="sec">いま案件がどこにあるか
      <span class="note">青＝契約前　緑＝契約済み　橙＝今月動く ／ 件数・予定売上（万円）</span>
    </h2>
    <div class="funnel" id="funnel"></div>

    <!-- 5. 契約前の案件と見込ランク -->
    <h2 class="sec">契約前の案件と見込ランク
      <span class="note">阻害要因の残数で判定：0＝S／2前後＝A／3前後＝B</span>
    </h2>
    <div class="tbl-scroll">
      <table id="preContractTable"></table>
    </div>
    <div class="legend">
      <span><span class="chip clear" style="display:inline-block">　</span> クリア済み</span>
      <span><span class="chip left" style="display:inline-block">　</span> 残っている</span>
      <span><span class="chip none" style="display:inline-block">　</span> 未入力</span>
      <span>価=価格／提=提案／担=担当者／社=会社／時=時期／決=決裁者／競=競合</span>
    </div>
    <div class="note-box" id="blockerNote"></div>

    <!-- 6. 着工前／工事中／これから現調 -->
    <div class="grid2" style="margin-top:22px">
      <div>
        <h2 class="sec" style="margin-top:0">着工前<span class="note" id="beforeStartNote"></span></h2>
        <div class="tbl-scroll"><table id="beforeStartTable"></table></div>
      </div>
      <div>
        <h2 class="sec" style="margin-top:0">工事中<span class="note" id="inWorkNote"></span></h2>
        <div class="tbl-scroll"><table id="inWorkTable"></table></div>

        <h2 class="sec">これから現調<span class="note" id="preSurveyNote"></span></h2>
        <div class="tbl-scroll"><table id="preSurveyTable"></table></div>
      </div>
    </div>

  </div>
</div>

<script src="shared.js"></script>
<script>
/* =========================================================
   日次・週次ダッシュボード
   ========================================================= */
let ALL = [], MINE = [], P = getParams(), YEAR, NOW = today();

(async function init() {
  P = getParams();
  YEAR = P.year;
  try {
    setLoading(true);
    ALL = await loadDeals('発生案件');
    MINE = applyFilter(ALL, P);
    buildSelectors(ALL, P, navigateBySelectors);
    render();
    document.getElementById('main').style.display = 'block';
  } catch (e) {
    showError(e.message || String(e));
  } finally {
    setLoading(false);
  }
})();

function render() {
  const label = [P.branch || '全支店', P.owner ? '担当者：' + P.owner : '全担当'].join('　');
  document.getElementById('chipTitle').textContent = label;
  document.title = `${label}｜日次・週次`;

  renderPerformance();
  renderMonthTable();
  renderKpi();
  renderFunnel();
  renderPreContract();
  renderLists();
}

/* ---------- 1. 今年の実績 ---------- */
function renderPerformance() {
  const t = targetsFor(P.owner);
  const yearSalesTarget = t.sales.reduce((a, b) => a + b, 0);

  // 契約売上
  const contracted = MINE.filter(d => sameYear(d.contract, YEAR) && !d.lost);
  const cAmount = sum(contracted, d => d.amount);
  const cCount  = contracted.length;
  // 見込み：契約前でランクS・A
  const openDeals = MINE.filter(d => !d.lost && !d.contract);
  const forecast  = openDeals.filter(d => CONFIG.forecastRanks.includes(d.rank));
  const cForecast = cAmount + sum(forecast, d => d.amount);
  const cTarget = CONFIG.contractTargetYear * 10000;

  drawPerf('perfContract', {
    actual: cAmount, forecast: cForecast, target: cTarget,
    lines: [
      `契約件数 ${cCount}件`,
      `平均単価 ${cCount ? fmtMan(cAmount / cCount) : '―'}万`
    ]
  });

  // 完工売上
  const done = MINE.filter(d => sameYear(d.complete, YEAR));
  const dAmount = sum(done, d => d.amount);
  const dProfit = sum(done, d => d.profit);
  // 見込み：未完工で完成予定が今年のもの
  const willDone = MINE.filter(d => !d.complete && !d.lost && d.contract && sameYear(d.completePlan, YEAR));
  drawPerf('perfComplete', {
    actual: dAmount, forecast: dAmount + sum(willDone, d => d.amount), target: yearSalesTarget,
    lines: [
      `完工件数 ${done.length}件`,
      `粗利率 ${dAmount ? fmtPct(dProfit / dAmount) : '―'}`
    ]
  });
}

function drawPerf(id, { actual, forecast, target, lines }) {
  const max = Math.max(actual, forecast, target) * 1.05 || 1;
  const pct = v => Math.min(100, (v / max) * 100);
  const rate = target ? actual / target : null;

  document.getElementById(id).innerHTML = `
    <div class="bar">
      <div class="fill" style="width:${pct(actual)}%"></div>
      <div class="fc" style="left:${pct(actual)}%;width:${Math.max(0, pct(forecast) - pct(actual))}%"></div>
      <div class="goal" style="left:${pct(target)}%"></div>
    </div>
    <div class="perf-nums">
      <span>実績 <span class="big">${fmtMan(actual)}</span>万</span>
      <span class="muted">／ 見込 ${fmtMan(forecast)}万</span>
      <span class="pill" style="margin-left:auto">目標 ${fmtMan(target)}万・達成率
        <b>${rate === null ? '―' : fmtPct(rate, 0)}</b></span>
    </div>
    <div class="perf-nums muted">${lines.map(t => `<span>${esc(t)}</span>`).join('')}</div>`;
}

/* ---------- 2. 月次推移（完工ベース） ---------- */
function renderMonthTable() {
  const t = targetsFor(P.owner);
  const cur = monthlyBuckets(), prev = monthlyBuckets(), fc = monthlyBuckets();

  MINE.forEach(d => {
    if (sameYear(d.complete, YEAR))     { const m = d.complete.getMonth(); cur[m].amount += d.amount || 0; cur[m].profit += d.profit || 0; cur[m].count++; }
    if (sameYear(d.complete, YEAR - 1)) { const m = d.complete.getMonth(); prev[m].amount += d.amount || 0; prev[m].profit += d.profit || 0; }
    if (!d.complete && !d.lost && d.contract && sameYear(d.completePlan, YEAR)) {
      const m = d.completePlan.getMonth(); fc[m].amount += d.amount || 0;
      fc[m].profit += (d.plannedProfit !== null ? d.plannedProfit : 0);
    }
  });

  const months = Array.from({ length: 12 }, (_, i) => i);
  const cum = arr => { let s = 0; return arr.map(v => (s += v)); };
  const sT   = months.map(i => t.sales[i]  || 0);
  const pT   = months.map(i => t.profit[i] || 0);
  const sA   = cur.map(b => b.amount), pA = cur.map(b => b.profit);
  const sPrev= prev.map(b => b.amount);
  const sFc  = fc.map(b => b.amount);

  const ratio = (a, b) => b ? a / b : null;
  const cellNum = (v, cls = '') => `<td class="num ${cls}">${v === null ? '―' : fmtMan(v)}</td>`;
  const cellPct = v => `<td class="num ${v !== null && v < 1 ? 'neg' : 'pos'}">${v === null ? '―' : fmtPct(v, 1)}</td>`;

  const row = (label, cells, cls = '') =>
    `<tr class="${cls}"><td class="rowlabel">${label}</td>${cells.join('')}</tr>`;

  const totalOf = arr => arr.reduce((a, b) => a + b, 0);
  const sACum = cum(sA), sTCum = cum(sT), pACum = cum(pA), pTCum = cum(pT);

  const head = `<thead>
    <tr><th class="l">${YEAR}年（完工ベース・万円）</th>
    ${months.map(i => `<th>${i + 1}月</th>`).join('')}<th>通期</th></tr></thead>`;

  const body = `<tbody>
    ${row('売上 目標',    [...sT.map(v => cellNum(v)), cellNum(totalOf(sT))], 'accent')}
    ${row('売上 月実績',  [...sA.map(v => cellNum(v)), cellNum(totalOf(sA))])}
    ${row('売上 目標対比',[...months.map(i => cellPct(ratio(sA[i], sT[i]))), cellPct(ratio(totalOf(sA), totalOf(sT)))])}
    ${row('売上 見込み',  [...sFc.map(v => cellNum(v || null)), cellNum(totalOf(sFc))])}
    ${row('売上 前年実績',[...sPrev.map(v => cellNum(v || null)), cellNum(totalOf(sPrev))])}
    ${row('売上 前年対比',[...months.map(i => cellPct(ratio(sA[i], sPrev[i]))), cellPct(ratio(totalOf(sA), totalOf(sPrev)))])}
    ${row('累計 目標',    [...sTCum.map(v => cellNum(v)), cellNum(totalOf(sT))])}
    ${row('累計 実績',    [...months.map(i => cellNum(sA[i] || sACum[i] ? sACum[i] : null)), cellNum(totalOf(sA))])}
    ${row('累計 目標対比',[...months.map(i => cellPct(ratio(sACum[i], sTCum[i]))), cellPct(ratio(totalOf(sA), totalOf(sT)))])}
    ${row('粗利 目標',    [...pT.map(v => cellNum(v)), cellNum(totalOf(pT))], 'accent')}
    ${row('粗利 月実績',  [...pA.map(v => cellNum(v)), cellNum(totalOf(pA))])}
    ${row('粗利 目標対比',[...months.map(i => cellPct(ratio(pA[i], pT[i]))), cellPct(ratio(totalOf(pA), totalOf(pT)))])}
    ${row('累計 粗利実績',[...months.map(i => cellNum(pA[i] || pACum[i] ? pACum[i] : null)), cellNum(totalOf(pA))])}
    ${row('粗利率',       [...months.map(i => cellPct(ratio(pA[i], sA[i]))), cellPct(ratio(totalOf(pA), totalOf(sA)))])}
  </tbody>`;

  document.getElementById('monthTable').innerHTML = head + body;

  document.getElementById('targetNote').innerHTML =
    `目標値はシートに無いため <b>shared.js の CONFIG.targets</b> に持たせています`
    + `（${P.owner ? esc(P.owner) + 'の個別設定が無ければ default を使用' : 'いまは default を表示中'}）。`
    + `担当者別に入れる場合は CONFIG.targets に担当者名で追加してください。`;
}

/* ---------- 3. 今月の状況 ---------- */
function renderKpi() {
  const newThisMonth = MINE.filter(d => sameMonth(d.inquiry, NOW)).length;
  const newThisYear  = MINE.filter(d => sameYear(d.inquiry, YEAR)).length;
  const active = MINE.filter(d => !d.lost && !d.complete);
  const open   = active.filter(d => !d.contract);
  const openAmount = sum(open, d => d.amount);
  const doneThisMonth = MINE.filter(d => !d.complete && !d.lost && d.contract && sameMonth(d.completePlan, NOW));

  const kpis = [
    { label: '今月の新規対応', value: newThisMonth, unit: '件' },
    { label: '今年の新規対応', value: newThisYear,  unit: '件' },
    { label: '進行中の案件',   value: active.length, unit: '件' },
    { label: '契約前の見込金額', value: Math.round(openAmount / 10000).toLocaleString('ja-JP'), unit: '万' },
    { label: '今月の完工予定', value: Math.round(sum(doneThisMonth, d => d.amount) / 10000).toLocaleString('ja-JP'), unit: '万' }
  ];
  document.getElementById('kpiRow').innerHTML = kpis.map(k => `
    <div class="kpi">
      <div class="label">${k.label}</div>
      <div class="value">${k.value}<small>${k.unit}</small></div>
    </div>`).join('');
}

/* ---------- 4. いま案件がどこにあるか ---------- */
function renderFunnel() {
  const active = MINE.filter(d => !d.lost);
  const by = s => active.filter(d => d.status === s);

  const thisMonthDone = active.filter(d => !d.complete && d.contract && sameMonth(d.completePlan, NOW));

  const boxes = [
    { key: 'preSurvey',   cls: 'blue',   list: by(STATUS.PRE_SURVEY).filter(d => !d.complete) },
    { key: 'surveyed',    cls: 'blue',   list: by(STATUS.SURVEYED) },
    { key: 'quoted',      cls: 'blue',   list: by(STATUS.QUOTED) },
    { key: 'beforeStart', cls: 'green',  list: by(STATUS.BEFORE_START) },
    { key: 'inWork',      cls: 'green',  list: by(STATUS.IN_WORK) },
    { key: 'thisMonth',   cls: 'orange', list: thisMonthDone, label: '今月完工予定' }
  ];

  document.getElementById('funnel').innerHTML = boxes.map(b => `
    <div class="fn ${b.cls}">
      <div class="t">${b.label || STATUS_LABEL[b.key]}</div>
      <div class="n">${b.list.length}<small>件</small></div>
      <div class="m">${fmtMan(sum(b.list, d => d.amount))}</div>
    </div>`).join('');
}

/* ---------- 5. 契約前の案件と見込ランク ---------- */
function renderPreContract() {
  const list = MINE.filter(d => !d.lost && !d.contract)
    .sort((a, b) => (a.plan ? a.plan - 0 : Infinity) - (b.plan ? b.plan - 0 : Infinity));

  const rankOf = d => {
    if (d.rank) return d.rank;                 // シートの「見込」を優先
    if (!d.blockerKnown) return '';            // 阻害要因が未入力なら判定しない
    return d.blockerLeft === 0 ? 'S' : d.blockerLeft <= 2 ? 'A' : 'B';
  };

  const head = `<thead><tr>
    <th class="l">顧客・物件</th><th>金額</th><th>契約予定</th>
    <th>阻害要因</th><th>残</th><th>ランク</th><th class="l">次にやること</th>
  </tr></thead>`;

  const body = list.length ? list.map(d => {
    const r = rankOf(d);
    return `<tr>
      <td class="l"><b>${esc(d.name || '(案件名なし)')}</b><br>
        <span style="color:var(--muted);font-size:11px">${esc([d.mediaM || d.mediaL, d.branch, d.owner].filter(Boolean).join('／'))}</span></td>
      <td class="num">${fmtMan(d.amount)}万</td>
      <td class="c">${d.plan ? fmtM(d.plan) : (d.planMonth ? d.planMonth + '月' : '未定')}</td>
      <td><div class="chips">${d.blockers.map(b =>
        `<span class="chip ${!d.blockerKnown ? 'none' : (b.remaining ? 'left' : 'clear')}" title="${b.full}">${b.label}</span>`).join('')}</div></td>
      <td class="c">${d.blockerKnown ? d.blockerLeft : '―'}</td>
      <td class="c"><span class="rank ${r || 'none'}">${r || '―'}</span></td>
      <td class="l">${esc(d.nextAction) || '<span style="color:var(--muted)">―</span>'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" class="empty">契約前の案件はありません</td></tr>`;

  document.getElementById('preContractTable').innerHTML = head + `<tbody>${body}</tbody>`;

  const hasBlocker = MINE.some(d => d.blockerKnown);
  document.getElementById('blockerNote').innerHTML = hasBlocker
    ? '阻害要因はシートの「阻害_価格」などの列から読んでいます。'
    : '<b>赤枠（阻害要因）は表示の仕組みはできていますが、いまのシートに元データがありません。</b>'
      + '発生案件シートに <b>阻害_価格／阻害_提案／阻害_担当者／阻害_会社／阻害_時期／阻害_決裁者／阻害_競合</b>'
      + '（残っていれば 1 か ○、クリアなら空欄）と <b>次にやること</b> の列を足せば、そのまま色が付きます。'
      + 'ランクは「見込」列の S/A/B を使い、空欄なら阻害要因の残数から判定します。';
}

/* ---------- 6. 着工前／工事中／これから現調 ---------- */
function renderLists() {
  const active = MINE.filter(d => !d.lost);

  const simpleTable = (rows, cols) =>
    `<thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.head}</th>`).join('')}</tr></thead>`
    + `<tbody>${rows.length ? rows.join('') : `<tr><td colspan="${cols.length}" class="empty">該当なし</td></tr>`}</tbody>`;

  const nameCell = d => `<td class="l"><b>${esc(d.name || '(案件名なし)')}</b><br>
    <span style="color:var(--muted);font-size:11px">${esc([d.mediaM || d.mediaL, d.cityGroup].filter(Boolean).join('／'))}</span></td>`;

  // 着工前
  const bs = active.filter(d => d.status === STATUS.BEFORE_START);
  document.getElementById('beforeStartTable').innerHTML = simpleTable(
    bs.map(d => `<tr>${nameCell(d)}<td class="num">${fmtMan(d.amount)}万</td><td class="c">${fmtM(d.completePlan)}</td></tr>`),
    [{ head: '顧客・物件', cls: 'l' }, { head: '金額' }, { head: '完工予定' }]);
  document.getElementById('beforeStartNote').textContent = `${bs.length}件／${fmtMan(sum(bs, d => d.amount))}万`;

  // 工事中
  const iw = active.filter(d => d.status === STATUS.IN_WORK);
  document.getElementById('inWorkTable').innerHTML = simpleTable(
    iw.map(d => `<tr>${nameCell(d)}<td class="num">${fmtMan(d.amount)}万</td>
      <td class="c ${sameMonth(d.completePlan, NOW) ? 'pos' : ''}"><b>${fmtM(d.completePlan)}</b></td></tr>`),
    [{ head: '顧客・物件', cls: 'l' }, { head: '金額' }, { head: '完工予定' }]);
  document.getElementById('inWorkNote').textContent = `${iw.length}件／${fmtMan(sum(iw, d => d.amount))}万`;

  // これから現調
  const ps = active.filter(d => d.status === STATUS.PRE_SURVEY)
    .sort((a, b) => (b.inquiry ? b.inquiry.getTime() : 0) - (a.inquiry ? a.inquiry.getTime() : 0));
  document.getElementById('preSurveyTable').innerHTML = simpleTable(
    ps.map(d => `<tr>${nameCell(d)}<td class="c">${d.inquiry ? fmtMD(d.inquiry) : '―'}</td>
      <td class="c">${d.survey ? fmtMD(d.survey) : '<b style="color:var(--orange)">日程調整中</b>'}</td></tr>`),
    [{ head: '顧客・物件', cls: 'l' }, { head: '反響日' }, { head: '現調予定' }]);
  document.getElementById('preSurveyNote').textContent = `${ps.length}件`;
}
</script>
</body>
</html>
