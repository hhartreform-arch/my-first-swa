<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>担当者別ダッシュボード｜日次・週次</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="title-chip" id="chipTitle">読み込み中</span>
    <div class="selects">
      <select id="blockSelect"></select>
      <select id="branchSelect"></select>
      <select id="ownerSelect"></select>
      <select id="yearSelect"></select>
    </div>
    <div class="navlinks">
      <a href="weekly.html" class="active">日次・週次</a>
      <a href="monthly.html">月次</a>
      <a href="#" id="diagLink">データ診断</a>
    </div>
    <div class="badge-use">日次・週次確認<br>メンバー用</div>
  </div>
</div>

<div class="wrap">
  <div id="errorBox" class="err"></div>
  <div id="loading" class="loading">データを読み込んでいます…</div>
  <div id="diagBox" class="card" style="display:none;margin-bottom:16px"></div>

  <div id="main" style="display:none">

    <!-- 1. 今年の実績 -->
    <h2 class="sec">今年の実績
      <span class="note">濃い塗り＝実績／斜線＝見込み（契約前案件の見込額を合算）／赤線＝目標　契約売上は<b>契約年</b>、完工売上は<b>完工年</b>で絞込み</span>
    </h2>
    <div class="grid2">
      <div class="card">
        <h3 class="sub">契約売上</h3>
        <div class="perf" id="perfContract"></div>
      </div>
      <div class="card">
        <h3 class="sub">完工売上</h3>
        <div class="perf" id="perfComplete"></div>
      </div>
    </div>

    <!-- 2. 月次推移 -->
    <div class="tbl-scroll" style="margin-top:14px">
      <table class="mini" id="monthTable"></table>
    </div>
    <div class="note-box" id="targetNote"></div>

    <!-- 3. 今月の状況 -->
    <h2 class="sec">今月の状況</h2>
    <div class="kpi-row" id="kpiRow"></div>

    <!-- 4. いま案件がどこにあるか -->
    <h2 class="sec">いま案件がどこにあるか
      <span class="note">青＝契約前　緑＝契約済み　橙＝今月動く ／ 件数・予定売上（万円）</span>
    </h2>
    <div class="funnel" id="funnel"></div>

    <!-- 5. 契約前の案件と見込ランク -->
    <h2 class="sec">契約前の案件と見込ランク
      <span class="note">阻害要因の残数で判定：0＝S／2前後＝A／3前後＝B</span>
    </h2>
    <div class="tbl-scroll">
      <table id="preContractTable"></table>
    </div>
    <div class="legend">
      <span><span class="chip clear" style="display:inline-block">　</span> クリア済み</span>
      <span><span class="chip left" style="display:inline-block">　</span> 残っている</span>
      <span><span class="chip none" style="display:inline-block">　</span> 未入力</span>
      <span>価=価格／提=提案／担=担当者／社=会社／時=時期／決=決裁者／競=競合</span>
    </div>
    <div class="note-box" id="blockerNote"></div>

    <!-- 6. 着工前／工事中／これから現調 -->
    <div class="grid2" style="margin-top:22px">
      <div>
        <h2 class="sec" style="margin-top:0">着工前<span class="note" id="beforeStartNote"></span></h2>
        <div class="tbl-scroll"><table id="beforeStartTable"></table></div>
      </div>
      <div>
        <h2 class="sec" style="margin-top:0">工事中<span class="note" id="inWorkNote"></span></h2>
        <div class="tbl-scroll"><table id="inWorkTable"></table></div>

        <h2 class="sec">これから現調<span class="note" id="preSurveyNote"></span></h2>
        <div class="tbl-scroll"><table id="preSurveyTable"></table></div>
      </div>
    </div>

  </div>
</div>

<script src="shared.js"></script>
<script>
/* =========================================================
   日次・週次ダッシュボード
   ========================================================= */
let ALL = [], MINE = [], TARGET_ROWS = null, TGT = null;
let P = null, YEAR = 0;
let FORECAST_COMPLETE = 0;  // 見込完工額（renderPerformanceで算出し、renderKpiでも使う）
const NOW = today();

/* 完工した案件の粗利（最終粗利が無ければ契約時粗利を使う） */
const profitOf = d => (d.profit !== null ? d.profit : d.plannedProfit);

(async function init() {
  P = getParams();
  YEAR = P.year;
  try {
    setLoading(true);
    const [deals, targets] = await Promise.all([loadDeals('発生案件'), loadTargets()]);
    ALL = deals;
    TARGET_ROWS = targets;
    MINE = applyFilter(ALL, P);
    TGT = targetsFrom(TARGET_ROWS, P, YEAR);
    buildSelectors(ALL, P, navigateBySelectors);
    mountDiagnostics(P);
    render();
    document.getElementById('main').style.display = 'block';
  } catch (e) {
    showError(e.message || String(e));
    mountDiagnostics({ debug: true });
  } finally {
    setLoading(false);
  }
})();

function render() {
  document.getElementById('chipTitle').textContent = filterLabel(P);
  document.title = filterLabel(P) + '｜日次・週次';
  renderPerformance();
  renderMonthTable();
  renderKpi();
  renderFunnel();
  renderPreContract();
  renderLists();
}

/* ---------- 1. 今年の実績 ---------- */
function renderPerformance() {
  const yearSalesTarget = TGT.sales.reduce((a, b) => a + b, 0);

  // 契約売上（実績＝「契約年」列がその年のものを合算。他の絞り込み条件は問わない）
  const contracted = MINE.filter(d => d.contractYear === YEAR);
  const cAmount = sum(contracted, d => d.amount);
  const cCount  = sum(contracted, d => d.cntContract);
  const open = MINE.filter(d => !d.lost && !d.contract);
  drawPerf('perfContract', {
    actual: cAmount,
    forecast: cAmount + sum(open, d => d.forecastAmt),
    target: yearSalesTarget * CONFIG.contractTargetRatio,
    lines: [`契約件数 ${cCount.toLocaleString('ja-JP')}件`,
            `平均単価 ${cCount ? fmtMan(cAmount / cCount) : '―'}万`,
            `見込みは契約前案件の見込額を合算`]
  });

  // 完工売上（実績＝「完工年」列がその年のものを合算。他の絞り込み条件は問わない）
  const done    = MINE.filter(d => d.completeYear === YEAR);
  const dAmount = sum(done, d => d.amount);
  const dCount  = sum(done, d => d.cntContract);
  const dProfit = sum(done, d => profitOf(d));
  FORECAST_COMPLETE = sum(done, d => d.forecastAmt);
  drawPerf('perfComplete', {
    actual: dAmount,
    forecast: dAmount,
    target: yearSalesTarget,
    lines: [`完工件数 ${dCount.toLocaleString('ja-JP')}件`,
            `粗利率 ${dAmount ? fmtPct(dProfit / dAmount) : '―'}`,
            `見込完工額 ${fmtMan(FORECAST_COMPLETE)}万`]
  });
}

function drawPerf(id, { actual, forecast, target, lines }) {
  const max = Math.max(actual, forecast, target) * 1.05 || 1;
  const pct = v => Math.min(100, (v / max) * 100);
  const r = target ? actual / target : null;
  document.getElementById(id).innerHTML = `
    <div class="bar">
      <div class="fill" style="width:${pct(actual)}%"></div>
      <div class="fc" style="left:${pct(actual)}%;width:${Math.max(0, pct(forecast) - pct(actual))}%"></div>
      <div class="goal" style="left:${pct(target)}%"></div>
    </div>
    <div class="perf-nums">
      <span>実績 <span class="big">${fmtMan(actual)}</span>万</span>
      ${forecast > actual ? `<span class="muted">／ 見込 ${fmtMan(forecast)}万</span>` : ''}
      <span class="pill" style="margin-left:auto">目標 ${fmtMan(target)}万・達成率
        <b>${r === null ? '―' : fmtPct(r, 0)}</b></span>
    </div>
    <div class="perf-nums muted">${lines.map(t => `<span>${esc(t)}</span>`).join('')}</div>`;
}

/* ---------- 2. 月次推移（完工年ベース） ---------- */
function renderMonthTable() {
  const cur = monthlyBuckets(), prev = monthlyBuckets();
  const showPrev = (YEAR - 1) >= CONFIG.minYear;

  MINE.forEach(d => {
    // 月の内訳は「完工月」列を優先し、無ければ完工基準日から拾う
    const m = d.completeMonth ? d.completeMonth - 1 : (d.completeBase ? d.completeBase.getMonth() : null);
    if (m === null || m < 0 || m > 11) return;
    if (d.completeYear === YEAR) {
      cur[m].amount += d.amount || 0; cur[m].profit += profitOf(d) || 0; cur[m].count++;
    }
    if (showPrev && d.completeYear === YEAR - 1) {
      prev[m].amount += d.amount || 0;
    }
  });

  const months = [...Array(12).keys()];
  const cum = arr => { let s = 0; return arr.map(v => (s += v)); };
  const sT = TGT.sales, pT = TGT.profit;
  const sA = cur.map(b => b.amount), pA = cur.map(b => b.profit);
  const sP = prev.map(b => b.amount);
  const total = a => a.reduce((x, y) => x + y, 0);
  const ratio = (a, b) => b ? a / b : null;

  const cNum = v => `<td class="num">${v === null || v === 0 ? '―' : fmtMan(v)}</td>`;
  const cPct = v => `<td class="num ${v !== null && v < 1 ? 'neg' : 'pos'}">${v === null ? '―' : fmtPct(v, 1)}</td>`;
  const row = (label, cells, cls = '') => `<tr class="${cls}"><td class="rowlabel">${label}</td>${cells.join('')}</tr>`;

  const sACum = cum(sA), sTCum = cum(sT), pACum = cum(pA);

  const prevRows = showPrev ? `
    ${row('売上 前年実績', [...sP.map(cNum), cNum(total(sP))])}
    ${row('売上 前年対比', [...months.map(i => cPct(ratio(sA[i], sP[i]))), cPct(ratio(total(sA), total(sP)))])}` : '';

  document.getElementById('monthTable').innerHTML = `
    <thead><tr><th class="l">${YEAR}年（完成日(予定)ベース・万円）</th>
      ${months.map(i => `<th>${i + 1}月</th>`).join('')}<th>通期</th></tr></thead>
    <tbody>
      ${row('売上 目標',     [...sT.map(cNum), cNum(total(sT))], 'accent')}
      ${row('売上 月実績',   [...sA.map(cNum), cNum(total(sA))])}
      ${row('売上 目標対比', [...months.map(i => cPct(ratio(sA[i], sT[i]))), cPct(ratio(total(sA), total(sT)))])}
      ${prevRows}
      ${row('累計 目標',     [...sTCum.map(cNum), cNum(total(sT))])}
      ${row('累計 実績',     [...months.map(i => cNum(sACum[i])), cNum(total(sA))])}
      ${row('累計 目標対比', [...months.map(i => cPct(ratio(sACum[i], sTCum[i]))), cPct(ratio(total(sA), total(sT)))])}
      ${row('粗利 目標',     [...pT.map(cNum), cNum(total(pT))], 'accent')}
      ${row('粗利 月実績',   [...pA.map(cNum), cNum(total(pA))])}
      ${row('粗利 目標対比', [...months.map(i => cPct(ratio(pA[i], pT[i]))), cPct(ratio(total(pA), total(pT)))])}
      ${row('累計 粗利実績', [...months.map(i => cNum(pACum[i])), cNum(total(pA))])}
      ${row('粗利率',        [...months.map(i => cPct(ratio(pA[i], sA[i]))), cPct(ratio(total(pA), total(sA)))])}
    </tbody>`;

  const note = document.getElementById('targetNote');
  if (TGT.source === 'sheet') {
    note.innerHTML = `目標は「${esc(CONFIG.targetSheet)}」シートの ${TGT.rows} 行を合計しています`
      + `（${esc(filterLabel(P))}／${YEAR}年度）。`
      + `担当者の行がある場合は担当者行だけを、無ければ支店の行を使います。`;
  } else if (TGT.source === 'empty') {
    note.innerHTML = `<b>「${esc(CONFIG.targetSheet)}」シートに、いまの絞り込み（${esc(filterLabel(P))}／${YEAR}年度）に合う行がありません。</b>`
      + `目標シートの「ブロック名・支店名・担当者」の表記が発生案件シートと一致しているか確認してください。`;
  } else {
    note.innerHTML = `<b>目標シートを読めなかったため、shared.js の CONFIG.fallbackTargets を表示しています。</b>`
      + `「データ診断」で原因を確認できます。`;
  }
}

/* ---------- 3. 今月の状況 ---------- */
function renderKpi() {
  const newMonth = MINE.filter(d => sameMonth(d.inquiry, NOW)).length;
  const newYear  = MINE.filter(d => sameYear(d.inquiry, YEAR)).length;
  const active   = MINE.filter(d => !d.lost && !d.isCompleted);
  const thisMonth = MINE.filter(d => d.contract && !d.lost && sameMonth(d.completeBase, NOW));

  const kpis = [
    { label: '今月の新規対応',   value: newMonth.toLocaleString('ja-JP'), unit: '件' },
    { label: '今年の新規対応',   value: newYear.toLocaleString('ja-JP'),  unit: '件' },
    { label: '進行中の案件',     value: active.length.toLocaleString('ja-JP'), unit: '件' },
    { label: '契約前の見込金額', value: fmtMan(FORECAST_COMPLETE), unit: '万' },
    { label: '今月の完工予定',   value: fmtMan(sum(thisMonth, d => d.amount)), unit: '万' }
  ];
  document.getElementById('kpiRow').innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="label">${k.label}</div>
      <div class="value">${k.value}<small>${k.unit}</small></div></div>`).join('');
}

/* ---------- 4. いま案件がどこにあるか ---------- */
function renderFunnel() {
  const active = MINE.filter(d => !d.lost);
  const by = s => active.filter(d => d.status === s);
  const thisMonth = active.filter(d => d.contract && sameMonth(d.completeBase, NOW));

  const boxes = [
    { key: 'preSurvey',   cls: 'blue',   list: by(STATUS.PRE_SURVEY) },
    { key: 'surveyed',    cls: 'blue',   list: by(STATUS.SURVEYED) },
    { key: 'quoted',      cls: 'blue',   list: by(STATUS.QUOTED) },
    { key: 'beforeStart', cls: 'green',  list: by(STATUS.BEFORE_START) },
    { key: 'inWork',      cls: 'green',  list: by(STATUS.IN_WORK) },
    { key: 'thisMonth',   cls: 'orange', list: thisMonth, label: '今月完工予定' }
  ];
  document.getElementById('funnel').innerHTML = boxes.map(b =>
    `<div class="fn ${b.cls}">
      <div class="t">${b.label || STATUS_LABEL[b.key]}</div>
      <div class="n">${b.list.length.toLocaleString('ja-JP')}<small>件</small></div>
      <div class="m">${fmtMan(sum(b.list, d => d.amount))}</div>
    </div>`).join('');
}

/* ---------- 5. 契約前の案件と見込ランク ---------- */
function renderPreContract() {
  const MAX = 100;
  const all = MINE.filter(d => !d.lost && !d.contract)
    .sort((a, b) => (a.plan ? a.plan.getTime() : Infinity) - (b.plan ? b.plan.getTime() : Infinity));
  const list = all.slice(0, MAX);

  const body = list.length ? list.map(d => {
    const r = d.rankEff;
    return `<tr>
      <td class="l"><b>${esc(d.name || '(案件名なし)')}</b><br>
        <span style="color:var(--muted);font-size:11px">${esc([d.mediaM || d.mediaL, d.branch, d.owner].filter(Boolean).join('／'))}</span></td>
      <td class="num">${fmtMan(d.forecastAmt)}万</td>
      <td class="c">${d.plan ? fmtM(d.plan) : (d.planMonth ? d.planMonth + '月' : '未定')}</td>
      <td><div class="chips">${d.blockers.map(b =>
        `<span class="chip ${!d.blockerKnown ? 'none' : (b.remaining ? 'left' : 'clear')}" title="${b.full}">${b.label}</span>`).join('')}</div></td>
      <td class="c">${d.blockerKnown ? d.blockerLeft : '―'}</td>
      <td class="c"><span class="rank ${r || 'none'}">${r || '―'}</span></td>
      <td class="l">${esc(d.nextAction) || '<span style="color:var(--muted)">―</span>'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" class="empty">契約前の案件はありません</td></tr>`;

  document.getElementById('preContractTable').innerHTML = `
    <thead><tr><th class="l">顧客・物件</th><th>見込金額</th><th>契約予定</th>
      <th>阻害要因</th><th>残</th><th>ランク</th><th class="l">次にやること</th></tr></thead>
    <tbody>${body}${all.length > MAX
      ? `<tr><td colspan="7" class="empty">ほか ${all.length - MAX} 件（契約予定日の早い順に${MAX}件まで表示）</td></tr>` : ''}</tbody>`;

  const hasBlocker = MINE.some(d => d.blockerKnown);
  document.getElementById('blockerNote').innerHTML = hasBlocker
    ? '阻害要因はシートの「阻害_価格」などの列から読んでいます。'
    : '<b>赤枠（阻害要因）は表示の仕組みはできていますが、いまのシートに元データがありません。</b>'
      + '発生案件シートに <b>阻害_価格／阻害_提案／阻害_担当者／阻害_会社／阻害_時期／阻害_決裁者／阻害_競合</b>'
      + '（残っていれば 1 か ○、クリアなら空欄）と <b>次にやること</b> の列を足せば、そのまま色が付きます。';
}

/* ---------- 6. 着工前／工事中／これから現調 ---------- */
function renderLists() {
  const MAX = 50;
  const active = MINE.filter(d => !d.lost);
  const table = (id, noteId, list, cols, rowFn) => {
    const shown = list.slice(0, MAX);
    document.getElementById(id).innerHTML =
      `<thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.head}</th>`).join('')}</tr></thead>`
      + `<tbody>${shown.length ? shown.map(rowFn).join('')
          : `<tr><td colspan="${cols.length}" class="empty">該当なし</td></tr>`}
        ${list.length > MAX ? `<tr><td colspan="${cols.length}" class="empty">ほか ${list.length - MAX} 件</td></tr>` : ''}</tbody>`;
    if (noteId) document.getElementById(noteId).textContent =
      `${list.length}件／${fmtMan(sum(list, d => d.amount))}万`;
  };
  const nameCell = d => `<td class="l"><b>${esc(d.name || '(案件名なし)')}</b><br>
    <span style="color:var(--muted);font-size:11px">${esc([d.mediaM || d.mediaL, d.branch].filter(Boolean).join('／'))}</span></td>`;

  const bs = active.filter(d => d.status === STATUS.BEFORE_START);
  table('beforeStartTable', 'beforeStartNote', bs,
    [{ head: '顧客・物件', cls: 'l' }, { head: '金額' }, { head: '完工予定' }],
    d => `<tr>${nameCell(d)}<td class="num">${fmtMan(d.amount)}万</td><td class="c">${fmtM(d.completeBase)}</td></tr>`);

  const iw = active.filter(d => d.status === STATUS.IN_WORK);
  table('inWorkTable', 'inWorkNote', iw,
    [{ head: '顧客・物件', cls: 'l' }, { head: '金額' }, { head: '完工予定' }],
    d => `<tr>${nameCell(d)}<td class="num">${fmtMan(d.amount)}万</td>
      <td class="c ${sameMonth(d.completeBase, NOW) ? 'pos' : ''}"><b>${fmtM(d.completeBase)}</b></td></tr>`);

  const ps = active.filter(d => d.status === STATUS.PRE_SURVEY)
    .sort((a, b) => (b.inquiry ? b.inquiry.getTime() : 0) - (a.inquiry ? a.inquiry.getTime() : 0));
  table('preSurveyTable', null, ps,
    [{ head: '顧客・物件', cls: 'l' }, { head: '反響日' }, { head: '現調予定' }],
    d => `<tr>${nameCell(d)}<td class="c">${fmtMD(d.inquiry)}</td>
      <td class="c">${d.survey ? fmtMD(d.survey) : '<b style="color:var(--orange)">日程調整中</b>'}</td></tr>`);
  document.getElementById('preSurveyNote').textContent = `${ps.length}件`;
}
</script>
</body>
</html>
